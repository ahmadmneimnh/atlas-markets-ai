# Provisioned so a fresh Grafana container comes up already pointed at
# Prometheus. Clicking through the setup wizard on every `docker compose down -v`
# is exactly the kind of friction that makes people stop looking at dashboards.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
