[project]
name = "atlas-ai-engine"
version = "0.1.0"
description = "Atlas Markets AI — scoring microservice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.1",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
  "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "RUF"]
# ANN101/ANN102 annotate `self` and `cls`, which is noise.
# B008 forbids function calls in argument defaults — correct for most code, and
# exactly wrong for FastAPI, where `Depends()` / `Header()` in a default IS the
# framework's dependency-injection mechanism. Suppressed globally rather than
# with a noqa at each call site, since every route signature would need one.
ignore = ["ANN101", "ANN102", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
